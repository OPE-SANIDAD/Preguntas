workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: 16.4
      cocoapods: default

    scripts:
      - name: Instalar dependencias
        script: |
          npm install

      - name: Sincronizar Capacitor
        script: |
          npx cap sync ios

      - name: Instalar Pods
        script: |
          cd ios/App
          pod install

      - name: Compilar
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
